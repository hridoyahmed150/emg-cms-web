name: CI

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Note: Vercel runs `next build` on deploy. ESLint is not gated here yet
      # (existing react-hooks warnings); add `npm run lint` once those are resolved.
